<!DOCTYPE html>
<html>
<head>
    <title>NFER VIZ</title>
    <style>
        .flex-container {
            display: flex;
            width: 100%;
            height: 100vh;
        }
        #heatmap-container {
            flex: 0 0 70%;
            overflow-y: auto;
            overflow-x: hidden;
            border: 1px solid #ccc;
            margin: 20px;
            max-height: calc(100vh - 40px);
        }
        #info-container {
            flex: 0 0 30%;
            border: 1px solid #ccc;
            padding: 20px;
            margin: 20px;
            background-color: #f9f9f9;
            overflow-y: auto;
            max-height: calc(100vh - 40px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        svg {
            display: block;
        }
        .grid line {
            stroke: lightgrey;
            stroke-opacity: 0.7;
            shape-rendering: crispEdges;
        }
        .grid path {
            stroke-width: 0;
        }
        #tooltip {
            position: absolute;
            opacity: 0;
            background: #fff;
            border: 1px solid #000;
            padding: 10px;
            border-radius: 3px;
            pointer-events: none;
            transition: opacity 0.2s;
        }
        #loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 16px solid #f3f3f3;
            border-top: 16px solid #3498db;
            border-radius: 50%;
            width: 120px;
            height: 120px;
            animation: spin 2s linear infinite;
            display: none;
        }
        @keyframes spin {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }
        #zoom-controls {
            position: absolute;
            left: -10px;
            top: 20px;
            width: 50px;
            height: 300px;
            border: 1px solid #ccc;
            padding: 10px;
            margin-right: 70px;
            background-color: #f9f9f9;
        }
        table {
            table-layout: auto;
            border-collapse: collapse;
            margin-bottom: 20px;
            width: auto;
        }
        table, th, td {
            border: 1px solid black;
        }
        th, td {
            padding: 10px;
            text-align: left;
            white-space: nowrap;
        }
        hr {
            border: 0;
            height: 1px;
            background: #333;
            background-image: linear-gradient(to right, #ccc, #333, #ccc);
            margin: 20px 0;
        }
    </style>
    <link rel="icon" href="data:,">

    <script src="https://d3js.org/d3.v6.min.js"></script>
    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js" integrity="sha384-mkQ3/7FUtcGyoppY6bz/PORYoGqOl7/aSUMn2ymDOJcapfS6PHqxhRTMh1RR0Q6+" crossorigin="anonymous"></script>
    <script src="static/heatmap.js" defer></script>
    
</head>
<body>
    <div class="flex-container">
        <div id="heatmap-container">
            <div id="zoom-controls">Zoom Levels</div>
            <div id="heatmap"></div>
            <div id="loader"></div>
        </div>
        <div id="info-container">
            <h3>Interval and Event Information</h3>
            <div id="table-container">
                Click on a heatmap cell to see the details here.
            </div>
            <hr>
            <h3>View Interval Hierarchy</h3>
            <div id="interval-hierarchy"></div>
            <h3>Specification Rules</h3>
            <label for="interval-select">Select Interval:</label>
            <select id="interval-select">
                <option value="" disabled selected>Select an interval</option>
            </select>
            <div id="interval-details"></div>
        </div>
    </div>
    <div id="tooltip"></div>
    
    </body>
</html>
